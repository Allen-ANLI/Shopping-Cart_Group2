 商城品牌、真实搜索和公共账户导航。

<a class="skip-link" [href]="skipUrl">Skip to content</a>
<div class="utility-bar"><div class="store-container utility-inner">
  <span>Singapore <span class="utility-divider">/</span> SGD</span>
  <span class="utility-welcome">A little upgrade for your everyday.</span>
</div></div>
<header class="store-container store-header">
  <a class="brand" [href]="listUrl" aria-label="Shopping Cart home">
    <span class="brand-mark"><app-icon name="bag" /></span>
    <span><strong>Shopping Cart<span class="brand-dot">.</span></strong><small>EVERYDAY ESSENTIALS</small></span>
  </a>
  <form class="catalog-search" role="search" action="/products" method="get">
    <label class="visually-hidden" for="product-search">Search products</label>
    <input id="product-search" name="q" type="search" [value]="query" maxlength="100"
      placeholder="Search keyboard, mouse, headphones…" autocomplete="off">
    <button class="button-primary" type="submit">Search</button>
  </form>
  <div class="header-note"><app-icon name="monitor" /><span>For work.<br><strong>For everyday.</strong></span></div>
</header>
<div class="store-container"><app-auth-navigation /></div>
<ng-content />
<footer class="store-container store-footer">
  <a [href]="listUrl">Shopping Cart<span class="brand-dot">.</span></a>
  <p>Everyday essentials, all in one place.</p><span>Prices in SGD</span>
</footer>
