spring.application.name=shopping-cart
server.port=18080

# F integration: allow a different host/port without changing the source.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/shopping_cart}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

spring.messages.basename=messages,messages-account,messages-catalog
spring.messages.encoding=UTF-8
spring.messages.fallback-to-system-locale=false
