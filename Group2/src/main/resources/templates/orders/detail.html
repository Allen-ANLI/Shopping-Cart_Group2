<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Order details')}"></head>
<body>

<header th:replace="~{fragments :: navbar}"></header>

<main class="container">

    <p class="small back-link">
        <a th:href="@{/orders}">&larr; Back to order history</a>
    </p>

    <div class="card">
        <h1>Order #<span th:text="${order.id}">1</span></h1>
        <p class="muted small"
           th:text="'Placed on ' + ${#temporals.format(order.createdAt, 'dd MMM yyyy HH:mm')}">
            Placed on
        </p>
    </div>

    <div class="card">
        <h3>Items</h3>
        <div class="table-wrap">
            <table>
                <thead>
                <tr>
                    <th>Product</th>
                    <th class="col-num">Unit price</th>
                    <th class="col-num">Qty</th>
                    <th class="col-num">Subtotal</th>
                </tr>
                </thead>
                <tbody>
                <!--
                  名称和单价来自订单明细的成交快照，不是商品表。
                  所以管理员在后台改了商品信息，这里显示的仍是成交时的值。
                -->
                <tr th:each="item : ${order.items}">
                    <td th:text="${item.productName}">Product</td>
                    <td class="col-num" th:text="'S$' + ${item.unitPrice}">S$0.00</td>
                    <td class="col-num" th:text="${item.quantity}">1</td>
                    <td class="col-num" th:text="'S$' + ${item.subtotal}">S$0.00</td>
                </tr>
                </tbody>
            </table>
        </div>

        <div class="summary-row summary-total">
            <span>Total (<span th:text="${order.totalQuantity}">1</span> item(s))</span>
            <span th:text="'S$' + ${order.totalAmount}">S$0.00</span>
        </div>
    </div>

    <p class="muted small">
        Prices shown are the prices at the time this order was placed.
        Later product updates do not change this order.
    </p>

</main>

<footer th:replace="~{fragments :: footer}"></footer>
</body>
</html>
