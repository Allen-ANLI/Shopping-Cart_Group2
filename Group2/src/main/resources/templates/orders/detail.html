<!DOCTYPE html><html lang="en" th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head(#{orders.details})}"></head><body>
<header th:replace="~{fragments :: navbar}"></header><main class="container" id="main-content">
<p class="back-link"><a href="/orders" th:text="#{orders.back}"></a></p><div class="card"><h1 th:text="#{orders.number(${order.id})}"></h1><p class="muted" th:text="#{orders.placed(${#temporals.format(order.createdAt, 'yyyy-MM-dd HH:mm')})}"></p></div><div class="card"><h2 th:text="#{items}"></h2><div class="table-wrap"><table><thead><tr><th th:text="#{product}"></th><th th:text="#{unitPrice}"></th><th th:text="#{quantity}"></th><th th:text="#{subtotal}"></th></tr></thead>
<tbody><tr th:each="item : ${order.items}"><td><span th:text="${item.productName}"></span></td><td th:text="'S$' + ${item.unitPrice}"></td><td th:text="${item.quantity}"></td><td th:text="'S$' + ${item.subtotal}"></td></tr></tbody></table></div><div class="summary-row summary-total"><span th:text="#{total}"></span><span th:text="'S$' + ${order.totalAmount}"></span></div></div><section th:replace="~{store/fragments :: shipping(${order.shipping})}"></section><p class="muted" th:if="${order.shipping == null}" th:text="#{orders.legacy}"></p><p class="muted small" th:text="#{orders.snapshot}"></p></main><footer th:replace="~{fragments :: footer}"></footer></body></html>
