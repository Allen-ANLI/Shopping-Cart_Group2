<!DOCTYPE html><html lang="en" th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head(#{orders.details})}"></head><body>
<header th:replace="~{fragments :: navbar}"></header><main class="container" id="main-content">
<p class="back-link"><a href="/orders" th:text="#{orders.back}"></a></p>
<div id="order-content" th:attr="data-order-url=@{/orders/{id}(id=${order.id})}">
<div th:replace="~{fragments :: alerts}"></div><p class="alert success" role="status" th:if="${param.paid}" th:text="#{payment.success}"></p><p class="alert success" role="status" th:if="${param.reviewed}" th:text="#{orderReview.saved}"></p>
<div class="card"><h1 th:text="#{orders.number(${order.id})}"></h1><p class="muted" th:text="#{orders.placed(${#temporals.format(order.createdAt, 'yyyy-MM-dd HH:mm')})}"></p>
<span class="order-status" th:text="${order.pendingPayment} ? #{payment.pending} : #{payment.paid}"></span>
<span class="order-status" th:unless="${order.pendingPayment}" th:text="${order.receiptConfirmed} ? #{shipment.confirmed} : #{shipment.awaiting}"></span>
<p th:if="${order.pendingPayment}"><a class="btn" th:href="@{/orders/{id}/payment(id=${order.id})}" th:text="#{payment.payNow}"></a></p></div>
<section class="card shipment-card" th:unless="${order.pendingPayment}"><h2 th:text="#{shipment.title}"></h2>
<ol class="shipment-timeline"><li th:each="stage : ${ {'collected','transit','delivery','delivered'} }"><span class="shipment-dot" aria-hidden="true">✓</span><strong th:text="${#messages.msg('shipment.' + stage)}"></strong><time th:if="${order.shipmentDeliveredAt != null}" th:text="${#temporals.format(order.shipmentDeliveredAt, 'yyyy-MM-dd HH:mm:ss')}"></time><span th:unless="${order.shipmentDeliveredAt != null}" th:text="#{shipment.historical}"></span></li></ol>
<form th:unless="${order.receiptConfirmed}" th:action="@{/orders/{id}/confirm(id=${order.id})}" method="post" data-order-action>
<input type="hidden" name="cartFormToken" th:value="${cartFormToken}"><p th:text="#{shipment.confirmHint}"></p><button class="btn" type="submit" th:text="#{shipment.confirm}"></button></form>
<p class="receipt-confirmed" th:if="${order.receiptConfirmed}"><span th:text="#{shipment.confirmed}"></span> · <time th:text="${#temporals.format(order.receiptConfirmedAt, 'yyyy-MM-dd HH:mm')}"></time></p></section>
<div class="card"><h2 th:text="#{orders.products}"></h2><div class="table-wrap"><table class="order-products-table"><thead><tr><th th:text="#{product}"></th><th th:text="#{unitPrice}"></th><th th:text="#{quantity}"></th><th th:text="#{subtotal}"></th><th th:if="${order.receiptConfirmed}" th:text="#{orders.review}"></th></tr></thead>
<tbody><tr th:each="item : ${order.items}"><td class="order-product-name"><a class="order-product-link" th:href="@{/products(id=${item.productId})}" th:text="${item.productName}"></a></td><td class="order-product-amount" th:attr="data-label=#{unitPrice}"><del class="original-price" th:if="${item.originalUnitPrice > item.unitPrice}" th:text="'S$' + ${item.originalUnitPrice}"></del><strong th:text="'S$' + ${item.unitPrice}"></strong></td><td class="order-product-amount" th:attr="data-label=#{quantity}" th:text="${item.quantity}"></td><td class="order-product-amount" th:attr="data-label=#{subtotal}" th:text="'S$' + ${item.subtotal}"></td><td class="order-product-review" th:if="${order.receiptConfirmed}"><span class="reviewed-badge" th:if="${ownReviews[item.productId] != null}"><svg class="review-action-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="m5 12 4 4L19 6"/></svg> <span th:text="#{orderReview.reviewed}"></span></span><a class="review-action" th:unless="${ownReviews[item.productId] != null}" th:href="@{/orders/{id}/reviews/{pid}(id=${order.id},pid=${item.productId})}"><svg class="review-action-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="m16 3 5 5-12 12H4v-5L16 3Z"/><path d="m13 6 5 5"/></svg> <span th:text="#{orderReview.write}"></span></a></td></tr></tbody></table></div><div th:replace="~{store/fragments :: pricing(${order.pricing})}"></div></div>
<section th:replace="~{store/fragments :: shipping(${order.shipping})}"></section><section th:replace="~{store/fragments :: payment(${order.payment})}"></section>
<p th:unless="${order.pendingPayment}"><a class="btn btn-outline receipt-download" th:href="@{/orders/{id}/receipt.pdf(id=${order.id})}" th:text="#{payment.download}"></a></p>
<p class="muted" th:if="${order.shipping == null}" th:text="#{orders.legacy}"></p><p class="muted small" th:text="#{orders.snapshot}"></p></div></main>
<footer th:replace="~{fragments :: footer}"></footer><script th:src="@{/store/payment-orders.js}" defer></script></body></html>
