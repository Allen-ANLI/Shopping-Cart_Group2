<!DOCTYPE html><html lang="en" th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{cart/fragments :: head(#{checkout.title})}"></head><body>
<header th:replace="~{cart/fragments :: navbar}"></header><main class="container" id="main-content">
<ol class="checkout-steps"><li><a href="/cart" th:text="#{nav.cart}"></a></li><li aria-hidden="true">→</li><li class="current" th:text="#{checkout.title}"></li><li aria-hidden="true">→</li><li th:text="#{checkout.done}"></li></ol>
<div class="page-header"><div><h1 th:text="#{checkout.review}"></h1><p class="muted" th:text="#{checkout.hint}"></p></div><a href="/cart" class="btn btn-secondary" th:text="#{checkout.back}"></a></div>
<div th:replace="~{cart/fragments :: alerts}"></div>
<div class="card empty-cart" th:if="${#lists.isEmpty(cartItems)}"><h2 th:text="#{cart.empty}"></h2><p th:text="#{checkout.emptyHint}"></p><a href="/products" class="btn" th:text="#{cart.browse}"></a></div>
<form th:unless="${#lists.isEmpty(cartItems)}" th:action="@{/checkout}" method="post" data-checkout-form th:attr="data-placing=#{checkout.placing},data-wait=#{checkout.wait}">
<input type="hidden" name="checkoutToken" th:value="${checkoutToken}">
<div class="checkout-layout"><div><section class="card"><div class="page-header"><h2 th:text="#{checkout.address}"></h2><a href="/account/addresses?returnTo=/checkout" th:text="#{checkout.manage}"></a></div>
<div th:if="${#lists.isEmpty(addresses)}"><p th:text="#{checkout.noAddress}"></p><a href="/account/addresses/new?returnTo=/checkout" class="btn" th:text="#{checkout.addAddress}"></a></div>
<div class="delivery-options"><label class="delivery-option" th:each="address : ${addresses}">
<input type="radio" name="addressId" th:value="${address.id}" th:checked="${address.id == selectedAddressId}" required>
<span><strong><span th:text="${address.recipientName}"></span> <small th:if="${address.defaultAddress}" th:text="#{checkout.default}"></small></strong><span th:text="${address.phone}"></span><p th:text="${address.addressLine1}"></p><p th:if="${address.addressLine2}" th:text="${address.addressLine2}"></p><small th:text="${address.city} + ', ' + ${address.postalCode} + ' · ' + ${address.country}"></small></span>
</label></div></section><section class="card"><h2 th:text="#{items}"></h2><div class="table-wrap"><table><thead><tr><th th:text="#{product}"></th><th th:text="#{unitPrice}"></th><th th:text="#{quantity}"></th><th th:text="#{subtotal}"></th></tr></thead>
<tbody><tr th:each="item : ${cartItems}"><td><span th:text="${item.productName}"></span><p class="form-error" th:if="${!item.available}" th:text="${item.problem}"></p></td><td th:text="'S$' + ${item.unitPrice}"></td><td th:text="${item.quantity}"></td><td th:text="'S$' + ${item.subtotal}"></td></tr></tbody></table></div></section></div>
<aside class="card cart-summary"><h2 th:text="#{checkout.total}"></h2><div class="summary-row"><span th:text="#{items}"></span><span th:text="${totalQuantity}"></span></div><div class="summary-row summary-total"><span th:text="#{total}"></span><span th:text="'S$' + ${cartTotal}"></span></div>
<p class="form-error" th:unless="${canCheckout}" th:text="#{cart.unavailable}"></p><p class="form-hint" th:text="#{cart.priceHint}"></p>
<button type="submit" class="btn btn-block btn-lg" th:disabled="${!canCheckout || #lists.isEmpty(addresses)}" data-place-order th:text="#{checkout.place}"></button><p class="form-hint" role="status" aria-live="polite" data-checkout-status></p></aside></div></form></main><footer th:replace="~{cart/fragments :: footer}"></footer><script th:src="@{/cart-assets/checkout.js}" defer></script></body></html>
