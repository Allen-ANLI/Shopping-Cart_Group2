<!DOCTYPE html><html lang="en" th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{cart/fragments :: head(#{checkout.done})}"></head><body>
<header th:replace="~{cart/fragments :: navbar}"></header><main class="container" id="main-content">
<ol class="checkout-steps"><li th:text="#{nav.cart}"></li><li aria-hidden="true">→</li><li th:text="#{checkout.title}"></li><li aria-hidden="true">→</li><li class="current" th:text="#{checkout.done}"></li></ol>
<div class="page-header"><div><h1 th:text="#{checkout.success}"></h1><p class="muted" th:text="#{checkout.saved}"></p></div><a href="/products" class="btn btn-secondary" data-continue-shopping th:text="#{cart.continue}"></a></div>
<div class="checkout-layout"><div><section class="card"><h2 th:text="#{orders.number(${receipt.id})}"></h2><p class="muted" th:text="${#temporals.format(receipt.createdAt, 'yyyy-MM-dd HH:mm')}"></p><div class="table-wrap"><table><thead><tr><th th:text="#{product}"></th><th th:text="#{unitPrice}"></th><th th:text="#{quantity}"></th><th th:text="#{subtotal}"></th></tr></thead>
<tbody><tr th:each="item : ${receipt.items}"><td><span th:text="${item.productName}"></span></td><td th:text="'S$' + ${item.unitPrice}"></td><td th:text="${item.quantity}"></td><td th:text="'S$' + ${item.subtotal}"></td></tr></tbody></table></div></section><section th:replace="~{store/fragments :: shipping(${receipt.shipping})}"></section><section th:replace="~{store/fragments :: payment(${receipt.payment})}"></section></div><aside class="card cart-summary"><h2 th:text="#{checkout.total}"></h2><p class="summary-total" th:text="'S$' + ${receipt.totalAmount}"></p><a th:href="@{/orders/{id}(id=${receipt.id})}" class="btn btn-block" th:text="#{checkout.viewOrder}"></a><a href="/orders" th:text="#{checkout.allOrders}"></a></aside></div></main><footer th:replace="~{cart/fragments :: footer}"></footer></body></html>
