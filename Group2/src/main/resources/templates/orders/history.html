<!DOCTYPE html><html lang="en" th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head(#{orders.title})}"></head><body>
<header th:replace="~{fragments :: navbar}"></header><main class="container" id="main-content">
<div class="page-header"><div><h1 th:text="#{orders.title}"></h1><p class="muted" th:text="#{orders.count(${orderCount})}"></p></div><a href="/products" class="btn btn-secondary" data-continue-shopping th:text="#{cart.continue}"></a></div>
<div class="stat-grid"><div class="stat-box"><div class="stat-value" th:text="${orderCount}"></div><div class="stat-label" th:text="#{orders.total}"></div></div><div class="stat-box"><div class="stat-value" th:text="'S$' + ${lifetimeSpend}"></div><div class="stat-label" th:text="#{orders.spend}"></div></div></div>
<div class="card" th:if="${#lists.isEmpty(orders)}"><p th:text="#{orders.empty}"></p><a href="/products" class="btn" th:text="#{cart.browse}"></a></div>
<div class="card" th:each="order : ${orders}"><div class="order-row"><div><strong th:text="#{orders.number(${order.id})}"></strong><p class="muted" th:text="${#temporals.format(order.createdAt, 'yyyy-MM-dd HH:mm')}"></p><p th:text="#{orders.itemCount(${order.itemCount})}"></p><span class="order-status" th:text="${order.pendingPayment} ? #{payment.pending} : (${order.receiptConfirmed} ? #{shipment.confirmed} : #{shipment.awaiting})"></span></div><div class="text-right"><p class="order-amount" th:text="'S$' + ${order.totalAmount}"></p><a th:if="${order.pendingPayment}" class="btn" th:href="@{/orders/{id}/payment(id=${order.id})}" th:text="#{payment.payNow}"></a> <a class="btn btn-outline" th:href="@{/orders/{id}(id=${order.id})}" th:text="#{orders.details}"></a></div></div></div>
<nav class="pagination" th:if="${totalPages > 1}"><a th:if="${currentPage > 1}" class="page-link" th:href="@{/orders(page=${currentPage - 1})}" th:text="#{previous}"></a><span th:unless="${currentPage > 1}" class="page-link disabled" th:text="#{previous}"></span><a class="page-link" th:each="i : ${#numbers.sequence(1, totalPages)}" th:classappend="${i == currentPage} ? 'active'" th:attr="aria-current=${i == currentPage ? 'page' : null}" th:href="@{/orders(page=${i})}" th:text="${i}"></a><a th:if="${currentPage < totalPages}" class="page-link" th:href="@{/orders(page=${currentPage + 1})}" th:text="#{next}"></a><span th:unless="${currentPage < totalPages}" class="page-link disabled" th:text="#{next}"></span></nav></main><footer th:replace="~{fragments :: footer}"></footer></body></html>
