<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Order history')}"></head>
<body>

<header th:replace="~{fragments :: navbar}"></header>

<main class="container">

    <div class="page-header">
        <div>
            <h1>Order history</h1>
            <p class="muted small" th:text="${orderCount} + ' order(s) placed'">0 order(s) placed</p>
        </div>
    </div>

    <div th:replace="~{fragments :: alerts}"></div>

    <div class="stat-grid">
        <div class="stat-box">
            <div class="stat-value" th:text="${orderCount}">0</div>
            <div class="stat-label">Total orders</div>
        </div>
        <div class="stat-box">
            <div class="stat-value" th:text="'S$' + ${lifetimeSpend}">S$0.00</div>
            <div class="stat-label">Lifetime spend</div>
        </div>
    </div>

    <!-- 空状态：没有订单时给出明确的下一步，而不是留一个空白页 -->
    <div class="card" th:if="${#lists.isEmpty(orders)}">
        <p class="muted">You have not placed any orders yet.</p>
        <a th:href="@{/products}" class="btn">Browse products</a>
    </div>

    <div th:unless="${#lists.isEmpty(orders)}">
        <div class="card" th:each="order : ${orders}">
            <div class="order-row">
                <div>
                    <p class="order-meta">
                        <!--
                          列表不显示订单号：D 的 Order 实体没有这个字段，
                          它只保证 checkout_token 唯一。需要展示单号时由 D 补充。
                          这里显示下单时间，足够用户定位订单。
                        -->
                        Order #<span th:text="${order.id}">1</span>
                    </p>
                    <p class="muted small"
                       th:text="${#temporals.format(order.createdAt, 'dd MMM yyyy HH:mm')}">
                        date
                    </p>
                    <p class="small"
                       th:text="${order.itemCount} + ' item(s)'">0 item(s)</p>
                </div>

                <div class="text-right">
                    <p class="order-amount" th:text="'S$' + ${order.totalAmount}">S$0.00</p>
                    <a th:href="@{/orders/{id}(id=${order.id})}"
                       class="btn btn-sm btn-outline">View details</a>
                </div>
            </div>
        </div>

        <!--
          分页导航。
          首尾页的链接用 disabled 类标灰而不是移除，
          保持页面高度稳定，也避免用户以为按钮坏了。
        -->
        <div class="pagination" th:if="${totalPages > 1}">
            <a class="page-link"
               th:classappend="${currentPage <= 1} ? 'disabled'"
               th:href="@{/orders(page=${currentPage - 1})}">Previous</a>
            <a class="page-link" th:each="i : ${#numbers.sequence(1, totalPages)}"
               th:classappend="${i == currentPage} ? 'active'"
               th:href="@{/orders(page=${i})}" th:text="${i}">1</a>
            <a class="page-link"
               th:classappend="${currentPage >= totalPages} ? 'disabled'"
               th:href="@{/orders(page=${currentPage + 1})}">Next</a>
        </div>
    </div>

</main>

<footer th:replace="~{fragments :: footer}"></footer>
</body>
</html>
