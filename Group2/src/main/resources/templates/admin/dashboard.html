<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:lang="${#locale.language}">
<head th:replace="~{fragments :: head(#{admin.dashboard.title})}"></head>
<body><header th:replace="~{fragments :: navbar}"></header>
<div class="container admin-layout"><aside th:replace="~{admin/fragments :: sidebar}"></aside>
<main class="admin-content" id="main-content" data-dashboard th:attr="data-endpoint=@{/api/admin/dashboard},data-product-url=@{/products},data-empty=#{admin.dashboard.empty},data-live=#{admin.dashboard.live},data-offline=#{admin.dashboard.offline},data-updated=#{admin.dashboard.updated}">
  <div class="page-header"><div><p class="eyebrow" th:text="#{admin.dashboard.eyebrow}">SALES OVERVIEW</p><h1 th:text="#{admin.dashboard.title}">Sales dashboard</h1><p class="muted" th:text="#{admin.dashboard.subtitle}">Track paid sales and product performance.</p></div></div>
  <div class="stat-grid dashboard-stats"><div class="stat-box"><div class="stat-value" data-total-sales th:text="'S$' + ${#numbers.formatDecimal(dashboard.totalSales, 1, 'COMMA', 2, 'POINT')}">S$0.00</div><div class="stat-label" th:text="#{admin.dashboard.totalSales}">Total sales</div></div><div class="stat-box"><div class="stat-value" data-item-count th:text="${dashboard.itemCount}">0</div><div class="stat-label" th:text="#{admin.dashboard.unitsSold}">Units sold</div></div><div class="stat-box"><div class="stat-value" data-order-count th:text="${dashboard.orderCount}">0</div><div class="stat-label" th:text="#{admin.dashboard.orders}">Paid orders</div></div></div>
  <div class="dashboard-status"><p class="muted" role="status" data-refresh-status th:text="#{admin.dashboard.live}">Updates automatically every 5 seconds after payment.</p><button type="button" class="btn btn-sm btn-outline" data-refresh th:text="#{admin.dashboard.refresh}">Refresh now</button></div>
  <section class="card dashboard-sales"><h2 th:text="#{admin.dashboard.productSales}">Sales by product</h2><p class="muted small" th:text="#{admin.dashboard.productHint}">Paid orders only.</p><div class="table-wrap"><table><thead><tr><th th:text="#{catalog.name}">Product</th><th class="col-num" th:text="#{admin.dashboard.unitPrice}">Sale unit price</th><th class="col-num" th:text="#{admin.dashboard.units}">Units sold</th><th class="col-num" th:text="#{admin.dashboard.revenue}">Revenue</th></tr></thead><tbody data-sales-rows><tr th:if="${#lists.isEmpty(dashboard.productSales)}"><td colspan="4" th:text="#{admin.dashboard.empty}">No paid sales yet.</td></tr><tr th:each="sale : ${dashboard.productSales}"><td><a th:href="@{/products(id=${sale.productId})}" th:text="${#locale.language == 'zh' and sale.nameZh != null ? sale.nameZh : sale.name}">Product</a></td><td class="col-num" th:text="'S$' + ${#numbers.formatDecimal(sale.unitPrice, 1, 'COMMA', 2, 'POINT')}">S$0.00</td><td class="col-num" th:text="${sale.quantity}">0</td><td class="col-num" th:text="'S$' + ${#numbers.formatDecimal(sale.revenue, 1, 'COMMA', 2, 'POINT')}">S$0.00</td></tr></tbody></table></div></section>
</main></div><footer th:replace="~{fragments :: footer}"></footer><script th:src="@{/store/admin-dashboard.js}" defer></script></body></html>
