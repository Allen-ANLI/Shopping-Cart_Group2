<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:lang="${#locale.language}">
<head th:replace="~{fragments :: head(#{catalog.admin.title})}"></head>
<body><header th:replace="~{fragments :: navbar}"></header>
<main class="container" id="main-content">
<div class="page-header"><div><h1 th:text="#{catalog.admin.title}"></h1><p class="muted small" th:text="#{catalog.admin.subtitle}"></p></div><a th:href="@{/admin/products/new}" class="btn" th:text="#{catalog.add}"></a></div>
<div th:replace="~{fragments :: alerts}"></div>
<div class="stat-grid"><div class="stat-box"><div class="stat-value" th:text="${totalProducts}"></div><div class="stat-label" th:text="#{catalog.total}"></div></div><div class="stat-box"><div class="stat-value" th:text="${inactiveProducts}"></div><div class="stat-label" th:text="#{catalog.hiddenCount}"></div></div></div>
<div class="card"><div class="table-wrap"><table>
<thead><tr><th class="col-id">ID</th><th th:text="#{catalog.name}"></th><th th:text="#{catalog.category}"></th><th th:text="#{catalog.brand}"></th><th class="col-num" th:text="#{catalog.price}"></th><th th:text="#{catalog.status}"></th><th class="col-actions" th:text="#{catalog.actions}"></th></tr></thead>
<tbody><tr th:if="${#lists.isEmpty(products)}"><td colspan="7" th:text="#{catalog.empty}"></td></tr><tr th:each="p : ${products}">
<td class="muted" th:text="${p.id}"></td><td><a th:if="${p.active}" th:href="@{/products(id=${p.id})}" th:text="${#locale.language == 'zh' ? p.nameZh : p.name}"></a><span th:unless="${p.active}" th:text="${#locale.language == 'zh' ? p.nameZh : p.name}"></span></td>
<td th:text="${#messages.msg('catalog.category.' + p.category)}"></td><td th:text="${p.brand}"></td><td class="col-num" th:text="'S$' + ${p.price}"></td>
<td><span class="badge badge-in" th:if="${p.active}" th:text="#{catalog.visible}"></span><span class="badge badge-out" th:unless="${p.active}" th:text="#{catalog.hidden}"></span></td>
<td><div class="action-group"><a th:href="@{/admin/products/{id}/edit(id=${p.id})}" class="btn btn-sm btn-outline" th:text="#{catalog.edit}"></a>
<form th:action="@{/admin/products/{id}/toggle(id=${p.id})}" method="post" class="inline-form"><button type="submit" class="btn btn-sm btn-secondary" th:text="${p.active} ? #{catalog.hide} : #{catalog.show}"></button></form>
<form th:action="@{/admin/products/{id}/delete(id=${p.id})}" method="post" class="inline-form" th:attr="data-confirm=#{catalog.deleteConfirm}"><button type="submit" class="btn btn-sm btn-danger" th:text="#{catalog.delete}"></button></form>
</div></td></tr></tbody></table></div></div>
<nav class="pagination" th:if="${totalPages > 1}" th:attr="aria-label=#{catalog.pagination}">
<a class="page-link" th:if="${currentPage > 1}" th:href="@{/admin/products(page=${currentPage - 1})}" th:text="#{catalog.previous}"></a>
<a class="page-link" th:each="i : ${#numbers.sequence(1, totalPages)}" th:classappend="${i == currentPage} ? 'active'" th:attr="aria-current=${i == currentPage ? 'page' : null}" th:href="@{/admin/products(page=${i})}" th:text="${i}"></a>
<a class="page-link" th:if="${currentPage < totalPages}" th:href="@{/admin/products(page=${currentPage + 1})}" th:text="#{catalog.next}"></a>
</nav><p class="muted small" th:text="#{catalog.visibilityHint}"></p>
</main><footer th:replace="~{fragments :: footer}"></footer></body></html>
