<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">
    <title>Shopping Cart</title>
    <link rel="icon" th:href="@{/products/favicon.svg}" type="image/svg+xml">
</head>
<body>
<h1>Shopping Cart</h1>
<p th:text="${message}">Welcome!</p>
<p>
    <a th:href="@{/products}">Browse products</a>
    · <a th:href="@{/cart/products}">Add products</a>
    · <a th:href="@{/cart}">Cart</a>
    · <a th:href="@{/orders}">Orders</a>
    · <a th:href="@{/account}">Account</a>
    · <a th:unless="${isLoggedIn}" th:href="@{/login}">Log in</a>
    <a th:if="${isAdmin}" th:href="@{/admin/products}">Admin</a>
</p>
<form th:if="${isLoggedIn}" th:action="@{/logout}" method="post">
    <button type="submit">Log out</button>
</form>
</body>
</html>
