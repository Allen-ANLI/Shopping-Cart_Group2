<!DOCTYPE html><html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(title)"><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title th:text="${title}">Shopping cart</title><link rel="stylesheet" th:href="@{/cart-assets/style.css}">
<link rel="stylesheet" th:href="@{/auth-assets/navigation.css}">
<link rel="icon" th:href="@{/products/favicon.svg}" type="image/svg+xml"></head>
<body><header th:fragment="navbar" class="navbar"><nav class="container auth-nav">
<a class="brand" th:href="@{/products}">Shopping Cart</a>
<div class="auth-links"><a th:href="@{/products}">Products</a>
<a th:href="@{/cart}" th:text="'Cart (' + ${cartQuantity ?: 0} + ')'">Cart (0)</a>
<a th:if="${isLoggedIn}" th:href="@{/orders}">Orders</a>
<a th:if="${isLoggedIn}" th:href="@{/account}">Account</a>
<a th:if="${isAdmin}" th:href="@{/admin/products}">Admin</a>
<a th:unless="${isLoggedIn}" th:href="@{/login}">Log in</a>
<form th:if="${isLoggedIn}" th:action="@{/logout}" method="post"><button type="submit">Log out</button></form>
</div></nav></header>
<div th:fragment="alerts"><p role="alert" class="form-error" th:if="${errorMessage}" th:text="${errorMessage}"></p>
<p role="status" th:if="${successMessage}" th:text="${successMessage}"></p></div>
<footer th:fragment="footer" class="container"><p>Shopping cart</p></footer></body></html>
