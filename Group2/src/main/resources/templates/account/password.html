<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org"><body>
<section th:fragment="settings" class="account-password" id="password-settings" aria-labelledby="password-settings-heading">
    <h2 id="password-settings-heading" th:text="#{account.password.title}">Change password</h2>
    <p class="muted" th:text="#{account.password.description}">Verify your current password, then choose a new password.</p>
    <p class="alert success" role="status" th:if="${passwordChanged}" th:text="#{account.password.saved}">Your password has been updated.</p>
    <form th:action="@{/account/password#password-settings}" th:object="${passwordChangeForm}" method="post" novalidate data-localized-form data-form-kind="password-change">
        <input type="hidden" name="accountFormToken" th:value="${accountFormToken}">
        <div class="alert error" role="alert" th:if="${#fields.hasAnyErrors()}">
            <p th:each="message : ${#fields.allErrors()}" th:text="${message}"></p>
        </div>
        <!-- Never bind password values back into the HTML after validation fails. -->
        <label for="currentPassword" th:text="#{account.password.current}">Current password</label>
        <div class="password-input">
            <input id="currentPassword" name="currentPassword" type="password" maxlength="72" autocomplete="current-password" required
                   th:attr="data-required-message=#{account.password.current.required},data-length-message=#{auth.password.max},data-bytes-message=#{auth.password.bytes}">
            <button th:replace="~{auth/fragments :: passwordToggle('currentPassword')}"></button>
        </div>
        <label for="newPassword" th:text="#{account.password.new}">New password</label>
        <div class="password-input">
            <input id="newPassword" name="newPassword" type="password" minlength="8" maxlength="50" autocomplete="new-password" required aria-describedby="new-password-hint"
                   th:attr="data-required-message=#{account.password.new.required},data-invalid-message=#{auth.password.strength},data-length-message=#{auth.password.length},data-bytes-message=#{auth.password.bytes}">
            <button th:replace="~{auth/fragments :: passwordToggle('newPassword')}"></button>
        </div>
        <p class="hint" id="new-password-hint" th:text="#{auth.password.hint}">8–50 characters, including uppercase, lowercase and a special character.</p>
        <label for="confirmNewPassword" th:text="#{account.password.confirm}">Confirm new password</label>
        <div class="password-input">
            <input id="confirmNewPassword" name="confirmPassword" type="password" maxlength="50" autocomplete="new-password" required
                   th:attr="data-required-message=#{auth.password.confirm.required},data-invalid-message=#{auth.password.mismatch},data-length-message=#{auth.password.confirm.length}">
            <button th:replace="~{auth/fragments :: passwordToggle('confirmNewPassword')}"></button>
        </div>
        <button class="btn primary" type="submit" th:text="#{account.password.save}">Update password</button>
    </form>
</section>
</body></html>
