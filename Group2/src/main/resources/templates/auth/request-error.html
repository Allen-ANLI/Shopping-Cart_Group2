<!DOCTYPE html>
<html lang="en" th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{auth/fragments :: head(#{error.method})}"></head>
<body>
<header th:replace="~{auth/fragments :: navbar}"></header>
<main class="container narrow card" id="main-content">
    <p class="eyebrow" th:text="'405 · ' + #{error.method}">405</p>
    <h1 th:text="#{error.method}">Please use the form</h1>
    <p class="muted" th:text="${@uiText.translate(errorMessage)}">This action must be submitted using its form.</p>
    <a class="btn primary" th:href="@{/account}" th:text="#{nav.account}">Back to account</a>
</main>
<footer th:replace="~{auth/fragments :: footer}"></footer>
</body>
</html>
