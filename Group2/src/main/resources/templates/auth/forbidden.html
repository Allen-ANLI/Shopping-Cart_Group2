<!DOCTYPE html>
<html lang="en" th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{auth/fragments :: head(#{error.denied})}"></head>
<body>
<header th:replace="~{auth/fragments :: navbar}"></header>
<main class="container narrow card" id="main-content">
    <p class="eyebrow" th:text="'403 · ' + #{error.denied}">403</p>
    <h1 th:text="#{error.adminRequired}">Administrator access is required</h1>
    <p class="muted" th:text="#{error.adminHint}">Your account does not have permission to manage products.</p>
    <a class="btn primary" th:href="@{/products}" th:text="#{nav.products}">Back to products</a>
</main>
<footer th:replace="~{auth/fragments :: footer}"></footer>
</body>
</html>
