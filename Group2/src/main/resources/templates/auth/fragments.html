<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${title} + ' | ShopCart CA'">ShopCart CA</title>
    <link rel="stylesheet" th:href="@{/auth-assets/style.css}">
    <link rel="icon" th:href="@{/products/favicon.svg}" type="image/svg+xml">
</head>
<body>
<header th:fragment="navbar" class="navbar">
    <nav class="container nav-inner" aria-label="Main navigation">
        <a class="brand" th:href="@{/products}">ShopCart CA</a>
        <div class="nav-links">
            <a th:href="@{/products}">Products</a>
            <a th:href="@{/cart/products}">Add products</a>
            <a th:href="@{/cart}">Cart</a>
            <a th:if="${isLoggedIn}" th:href="@{/orders}">Orders</a>
            <a th:if="${isLoggedIn}" th:href="@{/account}">Account</a>
            <a th:if="${isAdmin}" th:href="@{/admin/products}">Admin</a>
            <a th:unless="${isLoggedIn}" th:href="@{/login}">Log in</a>
            <form th:if="${isLoggedIn}" th:action="@{/logout}" method="post">
                <button class="btn-link" type="submit">Log out</button>
            </form>
        </div>
    </nav>
</header>
<div th:fragment="alerts">
    <p class="alert info" role="status" th:if="${infoMessage}" th:text="${infoMessage}"></p>
    <p class="alert success" role="status" th:if="${successMessage}" th:text="${successMessage}"></p>
    <p class="alert error" role="alert" th:if="${errorMessage}" th:text="${errorMessage}"></p>
</div>
<footer th:fragment="footer" class="container footer">NUS-ISS C26 · Module B · luopeiwen</footer>
</body>
</html>
