<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org"><head th:fragment="head(title)">
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title th:text="${title} + ' | NEXUS Digital'">NEXUS Digital</title>
<link rel="stylesheet" th:href="@{/auth-assets/style.css}"><link rel="stylesheet" th:href="@{/store/common.css}"><link rel="stylesheet" th:href="@{/auth-assets/account.css}">
<link rel="icon" th:href="@{/products/favicon.svg}" type="image/svg+xml"><script th:src="@{/store/common.js}" defer></script><script th:src="@{/auth-assets/account.js}" defer></script><link rel="stylesheet" th:href="@{/store/navigation.css}">
<link rel="stylesheet" th:href="@{/store/payment-orders.css}">
</head><body>
<header th:fragment="navbar" th:replace="~{store/fragments :: navbar}"></header>
<div th:fragment="alerts" class="store-alerts">
<p class="alert info" role="status" th:if="${infoMessage}" th:text="${infoMessage}"></p>
<p class="alert success alert-success" role="status" th:if="${successMessage}" th:text="${successMessage}"></p>
<p class="alert error alert-danger form-error" role="alert" th:if="${errorMessage}" th:text="${errorMessage}"></p>
<p class="alert alert-success" th:if="${param.created}" th:text="#{alert.created}"></p>
<p class="alert alert-success" th:if="${param.updated}" th:text="#{alert.updated}"></p>
<p class="alert alert-success" th:if="${param.toggled}" th:text="#{alert.toggled}"></p>
<p class="alert alert-success" th:if="${param.deleted}" th:text="#{alert.deleted}"></p>
</div><footer th:fragment="footer" th:replace="~{store/fragments :: footer}"></footer>
<button th:fragment="passwordToggle(fieldId)" type="button" class="password-eye" aria-pressed="false"
        th:attr="data-password-target=${fieldId},aria-controls=${fieldId},aria-label=#{auth.password.show},data-show=#{auth.password.show},data-hide=#{auth.password.hide}">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/><path class="eye-slash" d="m3 3 18 18"/></svg>
</button></body></html>
