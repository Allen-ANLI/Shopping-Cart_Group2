<!DOCTYPE html>
<html lang="en" th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head(#{error.title})}"></head>
<body>

<header th:replace="~{fragments :: navbar}"></header>

<main class="container" id="main-content">
    <div class="card error-card">
        <h1 th:text="${@uiText.translate(errorTitle)}">Action not allowed</h1>
        <!--
          业务规则被拒绝时的提示，比如：
          "这个商品出现在历史订单中，不能删除，请改为下架。"
        -->
        <p class="muted" th:text="${@uiText.translate(errorMessage)}">This action is not allowed.</p>
        <div class="form-actions">
            <a th:href="@{/products}" class="btn" th:text="#{nav.products}">Back to product list</a>
        </div>
    </div>
</main>

<footer th:replace="~{fragments :: footer}"></footer>
</body>
</html>
