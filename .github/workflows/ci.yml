name: CI-CD

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

env:
  IMAGE_NAME: shopping-cart

jobs:
  # ---------- 第 1 步：跑前端和后端的全部测试 ----------
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Group2
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Group2/frontend/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven

      - name: 前端检查 + 测试 + 构建 + 嵌入后端
        run: |
          cd frontend
          npm ci
          npm run deploy

      - name: 后端测试
        run: ./mvnw test

  # ---------- 第 2 步：打 Docker 镜像并推送到 Docker Hub ----------
  docker:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: ./Group2
          push: true
          tags: |
            docker.io/${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:latest
            docker.io/${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
